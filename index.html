<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://esoxzxhxeaazyblkbrvq.supabase.co wss://esoxzxhxeaazyblkbrvq.supabase.co; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
  <title>修仙打卡器</title>
  <meta name="theme-color" content="#5DBB8F">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="修仙打卡">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="bg-decor" aria-hidden="true">
    <span class="cloud c1"></span>
    <span class="cloud c2"></span>
    <span class="cloud c3"></span>
  </div>

  <!-- 登录视图 -->
  <div id="auth-view" class="auth-view">
    <div class="auth-card">
      <div class="mascot" aria-hidden="true">🐼</div>
      <h1 class="app-title">修仙打卡器</h1>
      <p class="app-subtitle">登录后数据跨设备同步</p>
      <input id="auth-email" class="auth-input" type="email" placeholder="邮箱" autocomplete="email">
      <input id="auth-password" class="auth-input" type="password" placeholder="密码（至少 8 位）" autocomplete="current-password">
      <div class="auth-actions">
        <button id="auth-signin-btn" class="btn btn-primary" type="button">登录</button>
        <button id="auth-signup-btn" class="btn btn-ghost" type="button">注册</button>
      </div>
      <p class="auth-hint">首次使用请先「注册」，查收邮箱确认邮件后再「登录」</p>
    </div>
  </div>

  <!-- 主应用视图 -->
  <main class="app hidden" id="app-view">
    <button id="settings-btn" class="settings-btn" type="button" aria-label="设置">⚙️ 设置</button>
    <header class="app-header">
      <span class="mascot" aria-hidden="true">🐼</span>
      <h1 class="app-title">修仙打卡器</h1>
      <p class="app-subtitle">每日一修，道心不破</p>
    </header>

    <section class="stats">
      <div class="stat-card stat-green">
        <span class="stat-label">修为值</span>
        <span class="stat-value" id="stat-cultivation">0</span>
        <span class="stat-unit">点</span>
      </div>
      <div class="stat-card stat-purple">
        <span class="stat-label">连续修炼</span>
        <span class="stat-value" id="stat-streak">0</span>
        <span class="stat-unit">天</span>
      </div>
      <div class="stat-card stat-red">
        <span class="stat-label">破戒</span>
        <span class="stat-value" id="stat-break">0</span>
        <span class="stat-unit">次</span>
      </div>
      <div class="stat-card stat-gold">
        <span class="stat-label">最长修炼</span>
        <span class="stat-value" id="stat-longest">0</span>
        <span class="stat-unit">天</span>
      </div>
    </section>

    <div class="countdown" id="countdown-box">距打卡 --:--:--</div>

    <section class="calendar">
      <div class="cal-toolbar">
        <button id="prev-btn" class="cal-nav" type="button" aria-label="上个月">‹</button>
        <div class="cal-title-wrap">
          <span id="cal-title" class="cal-title">2026 年 8 月</span>
          <button id="today-btn" class="cal-today" type="button">回今天</button>
        </div>
        <button id="next-btn" class="cal-nav" type="button" aria-label="下个月">›</button>
      </div>
      <div class="cal-week">
        <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
      </div>
      <div class="cal-grid" id="cal-grid"></div>
      <div class="cal-legend">
        <span><i class="dot dot-green"></i> 修为 +5</span>
        <span><i class="dot dot-red"></i> 破戒 −10</span>
        <span><i class="dot dot-blue"></i> 补卡</span>
        <span><i class="dot dot-empty"></i> 未打卡</span>
      </div>
    </section>

    <footer class="app-footer">
      <p>打卡窗口：每日 23:00 – 23:30 · 过去日期可随时补卡</p>
    </footer>
  </main>

  <!-- 打卡弹窗 -->
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="modal-close" type="button" aria-label="关闭">✕</button>
      <h2 class="modal-title" id="modal-title">打卡</h2>
      <div class="modal-colors">
        <button id="color-green" class="color-btn color-green" type="button">
          <span class="color-emoji">🟢</span><span class="color-text">修为 +5</span>
        </button>
        <button id="color-red" class="color-btn color-red" type="button">
          <span class="color-emoji">🔴</span><span class="color-text">破戒 −10</span>
        </button>
      </div>
      <label class="note-label" for="note-input">今日记录（可选）</label>
      <textarea id="note-input" class="note-input" rows="3" placeholder="写点什么，比如：打坐 1 小时 / 没忍住吃了夜宵…"></textarea>
      <p class="window-hint" id="window-hint"></p>
      <div class="modal-actions">
        <button id="delete-btn" class="btn btn-ghost" type="button">删除记录</button>
        <button id="save-btn" class="btn btn-primary" type="button">保存打卡</button>
      </div>
    </div>
  </div>

  <!-- 绿色打卡二次确认 -->
  <div class="modal-backdrop confirm-backdrop" id="confirm-modal">
    <div class="modal confirm-modal" role="dialog" aria-modal="true">
      <h2 class="modal-title">确定今日没有破戒？</h2>
      <p class="confirm-hint">若破戒了请如实选「否」，道心为重～</p>
      <div class="modal-actions">
        <button id="confirm-no" class="btn btn-red-solid" type="button">否，破戒了</button>
        <button id="confirm-yes" class="btn btn-primary" type="button">是，没破戒</button>
      </div>
      <button id="confirm-cancel" class="confirm-cancel" type="button">取消</button>
    </div>
  </div>

  <!-- 修为名言弹窗 -->
  <div class="modal-backdrop quote-backdrop" id="quote-modal">
    <div class="modal quote-modal" role="dialog" aria-modal="true">
      <div class="quote-scroll" aria-hidden="true">📜</div>
      <p class="quote-level" id="quote-level">当前修为</p>
      <p class="quote-text" id="quote-text"></p>
      <button id="quote-close" class="btn btn-primary quote-ok" type="button">继续修炼 ✨</button>
    </div>
  </div>

  <!-- 通用提示弹窗 -->
  <div class="modal-backdrop" id="notice-modal">
    <div class="modal notice-modal" role="dialog" aria-modal="true">
      <div class="notice-emoji" aria-hidden="true">🧘</div>
      <h2 class="modal-title">提示</h2>
      <p class="notice-text" id="notice-text"></p>
      <button id="notice-ok" class="btn btn-primary" type="button">知道了</button>
    </div>
  </div>

  <!-- 设置弹窗 -->
  <div class="modal-backdrop" id="settings-modal">
    <div class="modal settings-modal" role="dialog" aria-modal="true">
      <button class="modal-close" id="settings-close" type="button" aria-label="关闭">✕</button>
      <h2 class="modal-title">设置</h2>
      <p class="settings-email" id="settings-email"></p>
      <label class="note-label" for="bg-input">背景图 URL（留空则用默认）</label>
      <input id="bg-input" class="note-input" type="url" placeholder="https://…/背景图.jpg">
      <label class="note-label" for="icon-input">图标 URL（留空则用默认熊猫）</label>
      <input id="icon-input" class="note-input" type="url" placeholder="https://…/icon.png">
      <div class="modal-actions">
        <button id="settings-signout" class="btn btn-ghost" type="button">退出登录</button>
        <button id="settings-save" class="btn btn-primary" type="button">保存设置</button>
      </div>
    </div>
  </div>

  <!-- 提醒弹窗 -->
  <div class="reminder-pop" id="reminder-pop">
    <div class="reminder-card">
      <button class="reminder-close" id="reminder-close" type="button" aria-label="关闭">✕</button>
      <div class="reminder-panda" aria-hidden="true">🐼</div>
      <div class="reminder-bubble">
        <p class="reminder-text">道友！时辰到啦~</p>
        <p class="reminder-sub">23:00–23:30 打卡，今日修为 +5 等你拿！</p>
      </div>
      <div class="reminder-actions">
        <button id="reminder-later" class="btn btn-ghost" type="button">稍后再说</button>
        <button id="reminder-go" class="btn btn-primary" type="button">去打卡 ✨</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="./vendor/supabase.min.js"></script>
  <script src="./supabase-config.js"></script>
  <script src="./logic.js"></script>
  <script src="./app.js"></script>
  <script src="./reminder.js"></script>
  <script src="./register-sw.js"></script>
</body>
</html>
